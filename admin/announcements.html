<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0C7A63">
    <title>Announcements · Carmela Subdivision</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body data-role="admin" data-page="announcements.html">
    <main class="view" id="main">
        <div class="page-head">
            <div>
                <h1>Announcements</h1>
                <p class="muted">Post updates every resident can see on their home screen</p>
            </div>
        </div>

        <div class="g2">
            <form class="card stack" data-demo="announce">
                <h2>New announcement</h2>
                <label class="field"><span class="field-l">Title</span>
                    <input class="input" name="title" required maxlength="80"
                        placeholder="e.g. Gate closed for repairs on Saturday"></label>
                <label class="field"><span class="field-l">Message</span>
                    <textarea class="input" name="body" rows="5" required
                        placeholder="What do residents need to know?"></textarea></label>
                <label class="switch-row">
                    <span><b>Pin to the top</b><small>Pinned notices appear first.</small></span>
                    <input type="checkbox" class="switch" name="pin">
                </label>
                <button class="btn primary" type="submit"><i data-i="megaphone"></i> Post announcement</button>
            </form>

            <section class="stack" id="ann-list" aria-label="Posted announcements"></section>
        </div>
    </main>

    <script src="../js/layout.js"></script>
    <script src="../js/app.js"></script>
</body>

</html>
